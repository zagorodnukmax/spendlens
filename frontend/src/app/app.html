@if (auth.user(); as user) {
  <header class="topbar">
    <a routerLink="/" class="brand">🔎 SpendLens</a>
    <nav>
      <a routerLink="/">Statements</a>
    </nav>
    <div class="user">
      <span>{{ user.displayName }}</span>
      <button class="ghost" (click)="auth.logout()">Log out</button>
    </div>
  </header>
}
<main>
  <router-outlet />
</main>
